name: Build Complete UP22 Live App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create and Build App
        run: |
          flutter create up22_live
          cd up22_live
          
          # पूरा नया ऐप कोड एक ही बार में लिखना
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(const UP22LiveApp());

          class UP22LiveApp extends StatelessWidget {
            const UP22LiveApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'UP22 Live',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F0C20),
                  primaryColor: const Color(0xFFFF007F),
                ),
                home: const AuthScreen(),
              );
            }
          }

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});
            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final TextEditingController _nameController = TextEditingController();

            void _login() {
              String userName = _nameController.text.trim().isEmpty ? 'User_${DateTime.now().millisecond}' : _nameController.text.trim();
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (context) => MainNavigation(userName: userName)));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(24),
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF1E0836), Color(0xFF0F0C20)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                  ),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.rocket_launch, size: 80, color: Color(0xFFFFD700)),
                      const SizedBox(height: 10),
                      const Text('UP22 LIVE', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, letterSpacing: 2, color: Colors.white)),
                      const SizedBox(height: 40),
                      TextField(
                        controller: _nameController,
                        style: const TextStyle(color: Colors.white),
                        decoration: InputDecoration(
                          hintText: 'Enter Nickname / User ID',
                          hintStyle: const TextStyle(color: Colors.white54),
                          filled: true,
                          fillColor: const Color(0xFF231B42),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(15), borderSide: BorderSide.none),
                          prefixIcon: const Icon(Icons.person, color: Colors.pinkAccent),
                        ),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF4285F4), minimumSize: const Size(double.infinity, 50), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15))),
                        icon: const Icon(Icons.g_mobiledata, size: 30, color: Colors.white),
                        label: const Text('Sign in with Google', style: TextStyle(fontSize: 16, color: Colors.white)),
                        onPressed: _login,
                      ),
                      const SizedBox(height: 12),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00C853), minimumSize: const Size(double.infinity, 50), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15))),
                        icon: const Icon(Icons.phone, color: Colors.white),
                        label: const Text('Phone Number OTP', style: TextStyle(fontSize: 16, color: Colors.white)),
                        onPressed: _login,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class MainNavigation extends StatefulWidget {
            final String userName;
            const MainNavigation({super.key, required this.userName});
            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int _currentIndex = 0;
            late List<Widget> _pages;

            @override
            void initState() {
              super.initState();
              _pages = [HomeScreen(userName: widget.userName), const Center(child: Text('Moments & Feed')), const Center(child: Text('Messages')), ProfileScreen(userName: widget.userName)];
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _pages[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (index) => setState(() => _currentIndex = index),
                  backgroundColor: const Color(0xFF16122B),
                  selectedItemColor: const Color(0xFFFF007F),
                  unselectedItemColor: Colors.white54,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home_filled), label: 'Live'),
                    BottomNavigationBarItem(icon: Icon(Icons.explore), label: 'Moments'),
                    BottomNavigationBarItem(icon: Icon(Icons.chat_bubble), label: 'Messages'),
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Profile'),
                  ],
                ),
              );
            }
          }

          class HomeScreen extends StatelessWidget {
            final String userName;
            const HomeScreen({super.key, required this.userName});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('UP22 Live', style: TextStyle(fontWeight: FontWeight.bold)), backgroundColor: Colors.transparent, elevation: 0),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        height: 120, width: double.infinity,
                        decoration: BoxDecoration(gradient: const LinearGradient(colors: [Colors.purple, Colors.pinkAccent]), borderRadius: BorderRadius.circular(15)),
                        padding: const EdgeInsets.all(16),
                        child: const Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.center, children: [Text('🔥 Mega Voice Contest', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)), Text('Win 50,000 Free Diamonds', style: TextStyle(color: Colors.white70))]),
                      ),
                      const SizedBox(height: 20),
                      const Text('Trending Voice Rooms', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      GridView.builder(
                        shrinkWrap: true, physics: const NeverScrollableScrollPhysics(),
                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 2, crossAxisSpacing: 12, mainAxisSpacing: 12, childAspectRatio: 0.85),
                        itemCount: 4,
                        itemBuilder: (context, index) {
                          return GestureDetector(
                            onTap: () => Navigator.push(context, MaterialPageRoute(builder: (context) => const VoicePartyRoom())),
                            child: Container(
                              decoration: BoxDecoration(color: const Color(0xFF231B42), borderRadius: BorderRadius.circular(15)),
                              child: Column(
                                children: [
                                  Expanded(child: Container(decoration: const BoxDecoration(color: Colors.deepPurpleAccent, borderRadius: BorderRadius.vertical(top: Radius.circular(15))), child: const Center(child: Icon(Icons.mic, size: 50, color: Colors.white)))),
                                  Padding(padding: const EdgeInsets.all(8.0), child: Text('Mega Party #${index + 1}', style: const TextStyle(fontWeight: FontWeight.bold))),
                                ],
                              ),
                            ),
                          );
                        },
                      ),
                    ],
                  ),
                ),
                floatingActionButton: FloatingActionButton.extended(
                  backgroundColor: const Color(0xFFFF007F),
                  onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (context) => const VoicePartyRoom())),
                  icon: const Icon(Icons.add_circle_outline), label: const Text('Start Party'),
                ),
              );
            }
          }

          class VoicePartyRoom extends StatefulWidget {
            const VoicePartyRoom({super.key});
            @override
            State<VoicePartyRoom> createState() => _VoicePartyRoomState();
          }

          class _VoicePartyRoomState extends State<VoicePartyRoom> {
            bool isMicOn = false;
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('🔥 17-Seat Party Room'), backgroundColor: Colors.transparent),
                body: Column(
                  children: [
                    const CircleAvatar(radius: 35, backgroundColor: Color(0xFFFF007F), child: Icon(Icons.star, size: 35, color: Colors.white)),
                    const Text('Room Host', style: TextStyle(fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    Expanded(
                      child: GridView.builder(
                        padding: const EdgeInsets.all(16),
                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 4, crossAxisSpacing: 10, mainAxisSpacing: 10),
                        itemCount: 16,
                        itemBuilder: (context, index) => Container(
                          decoration: BoxDecoration(color: const Color(0xFF231B42), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.pinkAccent.withOpacity(0.3))),
                          child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [const Icon(Icons.person_outline, color: Colors.white54), Text('Seat ${index + 1}', style: const TextStyle(fontSize: 10, color: Colors.white70))]),
                        ),
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: const BoxDecoration(color: Color(0xFF16122B), borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceAround,
                        children: [
                          IconButton(icon: Icon(isMicOn ? Icons.mic : Icons.mic_off, color: isMicOn ? Colors.green : Colors.red), onPressed: () => setState(() => isMicOn = !isMicOn)),
                          ElevatedButton.icon(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF007F)), icon: const Icon(Icons.card_giftcard), label: const Text('Gift (100)'), onPressed: () {}),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class ProfileScreen extends StatelessWidget {
            final String userName;
            const ProfileScreen({super.key, required this.userName});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Profile'), backgroundColor: Colors.transparent),
                body: Center(
                  child: Column(
                    children: [
                      const SizedBox(height: 20),
                      const CircleAvatar(radius: 45, backgroundColor: Color(0xFFFF007F), child: Icon(Icons.person, size: 50, color: Colors.white)),
                      const SizedBox(height: 10),
                      Text(userName, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                      const Text('Level 10 VIP', style: TextStyle(color: Colors.white70)),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          flutter build apk --debug

      - name: Upload Complete APK
        uses: actions/upload-artifact@v4
        with:
          name: UP22_Live_Final_App
          path: up22_live/build/app/outputs/flutter-apk/app-debug.apk
